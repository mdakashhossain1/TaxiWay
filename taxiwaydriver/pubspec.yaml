name: taxiwaydriver
description: "Taxiway Driver App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  bootstrap_icons: ^1.13.1+3
  url_launcher: ^6.3.2
  http: ^1.2.0
  crypto: ^3.0.3
  smart_auth: ^3.2.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  firebase_messaging: ^16.6.0
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
