name: Sync taxiway_admin/ folder → admin branch

on:
  push:
    branches:
      - main
    paths:
      - 'taxiway_admin/**'    # only trigger when files inside taxiway_admin/ change

permissions:
  contents: write     # allow pushing to admin branch

jobs:
  sync-admin-folder:
    name: Extract taxiway_admin/ and push to admin branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push taxiway_admin/ contents (not the folder itself) to admin branch
        run: |
          # Switch to admin branch — explicitly reference remote to avoid
          # ambiguity with the local taxiway_admin/ directory
          git checkout -B admin origin/admin

          # Wipe all tracked files so the branch is clean
          git rm -rf . --quiet

          # Pull only the taxiway_admin/ subfolder from the latest main commit
          git checkout origin/main -- taxiway_admin/

          # Move everything inside taxiway_admin/ up to the repo root
          shopt -s dotglob
          mv taxiway_admin/* .
          rmdir taxiway_admin

          # Commit only if something actually changed
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: update admin branch from main/admin/ [skip ci]"
            git push origin admin
          fi
